name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /graph-reduction-machine
      GHC_WASM_FLAVOUR: '9.12'
      GHC_WASM_META_REV: '8079eb96bbc63823d99ad8acaff0765532625474'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true
      - run: deno ci
      - name: Install parser generators
        run: |
          sudo apt-get update
          sudo apt-get install -y bnfc alex happy
      - name: Restore GHC WASM toolchain
        id: wasm-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ env.GHC_WASM_FLAVOUR }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GHC_WASM_META_REV }}
      - name: Install GHC WASM toolchain
        if: steps.wasm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir "$RUNNER_TEMP/ghc-wasm-meta"
          curl --fail --location --retry 5 "https://codeload.github.com/haskell-wasm/ghc-wasm-meta/tar.gz/$GHC_WASM_META_REV" |
            tar xz --strip-components=1 -C "$RUNNER_TEMP/ghc-wasm-meta"
          FLAVOUR="$GHC_WASM_FLAVOUR" bash "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
      - name: Build playground WebAssembly
        run: |
          source ~/.ghc-wasm/env
          deno task build:wasm
          deno task test:wasm
      - run: deno task verify
      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
