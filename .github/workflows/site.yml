name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /graph-reduction-machine
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true
      - run: deno ci
      - run: deno task verify
      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
