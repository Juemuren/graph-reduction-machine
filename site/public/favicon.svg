<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Lambda calculus and SKI graph favicon">
  <defs>
    <style>
      .lambda-begin { stop-color: #7287fd; }
      .lambda-middle { stop-color: #8839ef; }
      .lambda-end { stop-color: #df8e1d; }
      .graph-edge { stroke: #df8e1d; }
      .graph-node { fill: #df8e1d; }

      @media (prefers-color-scheme: dark) {
        .lambda-begin { stop-color: #b4befe; }
        .lambda-middle { stop-color: #cba6f7; }
        .lambda-end { stop-color: #f9e2af; }
        .graph-edge { stroke: #f9e2af; }
        .graph-node { fill: #f9e2af; }
      }
    </style>
    <linearGradient id="lambda" x1="20" y1="38" x2="75" y2="75" gradientUnits="userSpaceOnUse">
      <stop class="lambda-begin" offset="0"/>
      <stop class="lambda-middle" offset="0.8"/>
      <stop class="lambda-end" offset="1"/>
    </linearGradient>
    <mask id="ring-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>
      <circle cx="72.7" cy="73.8" r="5.1" fill="black"/>
      <circle cx="101.6" cy="49.6" r="5.1" fill="black"/>
      <circle cx="100.6" cy="86.1" r="5.1" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#ring-holes)">
  <!-- Application-graph edges, centered on the circular node geometry -->
  <g class="graph-edge" fill="none" stroke-width="4.8" stroke-linecap="round">
    <path d="
      M72.7 73.8
      L101.6 49.6
      M72.7 73.8
      L100.6 86.1
      "
    />
  </g>
  <!-- Lambda silhouette, with its lower stroke flowing into the center node -->
  <path
    fill="url(#lambda)"
    d="
      M 18.7 83.3
      L 40.4 47.6
      L 38.3 42.1
      C 36.9 38.4 35.4 37.5 32.8 38
      C 29.9 38.4 26.0 42.6 23.6 43.6
      C 26.8 34.3 31.4 29.6 36.4 29.6
      C 42.5 29.6 44.4 33 46.8 41.8
      L 52.6 61.5
      C 54.8 69.4 58.2 70.5 61 70.6
      C 62.5 70.7 64.6 70.3 65 69.54
      L 72 70
      L 72 77
      L 65.5 78.86
      C 64.8 77.9 62.8 78.4 61 78.4
      C 52.7 78.4 48.9 72.9 46 64.2
      L 42.9 54.7
      L 29.8 83.3
      Z
    "
  />
  <!-- Circular nodes with transparent holes -->
  <circle cx="72.7" cy="73.8" r="8.8" fill="url(#lambda)"/>
  <g class="graph-node">
    <circle cx="101.6" cy="49.6" r="9.5"/>
    <circle cx="100.6" cy="86.1" r="9.4"/>
  </g>
  </g>
</svg>
